<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Prep Hub &bull; Suite de Certificación Cisco 200-301</title>
  <meta name="description" content="Plataforma interactiva para preparación de la certificación Cisco CCNA 200-301. Simulador Pearson VUE, Subnetting Dojo, y Banco de Errores con Repetición Espaciada.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Animated Network Topology Canvas -->
  <div class="backdrop">
    <canvas id="netCanvas"></canvas>
  </div>

  <!-- Mobile Toggle -->
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#06101f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2"/>
            <path d="M6 6h.01M6 18h.01M10 6h8M10 18h8"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">CCNA Prep Hub</div>
          <div class="brand-sub">Cisco 200-301 Suite</div>
        </div>
      </div>

      <nav class="stack" style="gap: 4px;">
        <a href="#dashboard" class="nav-link" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
          </svg>
          Dashboard
        </a>

        <a href="#practice" class="nav-link" data-route="practice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/><path d="M9 7h6M9 11h6"/>
          </svg>
          Práctica por Dominio
        </a>

        <a href="#exam" class="nav-link" data-route="exam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>
          </svg>
          Simulador Pearson VUE
        </a>

        <a href="#subnet" class="nav-link" data-route="subnet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-2.5a1.5 1.5 0 0 1 1.5-1.5h11a1.5 1.5 0 0 1 1.5 1.5V17"/>
          </svg>
          Subnetting Dojo
        </a>

        <a href="#review" class="nav-link" data-route="review">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
          </svg>
          Banco de Errores
          <span class="nav-badge" id="reviewBadge"></span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="small muted" style="display: block; margin-bottom: 2px;">Índice de Preparación</span>
        <strong id="sideReadiness" style="color: var(--accent);">0%</strong>
        <div style="margin-top: 10px; display: flex; gap: 6px;">
          <button class="btn btn-sm btn-ghost" id="btnExportData" title="Exportar respaldo de mi progreso a JSON" style="flex: 1; padding: 5px;">Exportar</button>
          <button class="btn btn-sm btn-ghost" id="btnImportData" title="Restaurar progreso desde un archivo JSON" style="flex: 1; padding: 5px;">Importar</button>
          <button class="btn btn-sm btn-ghost" id="btnResetData" title="Reiniciar progreso" style="padding: 5px; color: var(--danger);">&#x27f3;</button>
          <input type="file" id="fileImportData" accept=".json" style="display: none;">
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main" id="main"></main>
  </div>

  <!-- Scripts -->
  <script src="data/questions.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/practice.js"></script>
  <script src="js/views/exam.js"></script>
  <script src="js/views/subnetting.js"></script>
  <script src="js/views/review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
